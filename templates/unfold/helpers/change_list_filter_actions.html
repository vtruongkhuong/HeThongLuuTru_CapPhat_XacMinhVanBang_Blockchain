{% load i18n unfold %}

{% if cl.model_admin.list_filter_submit or cl.is_facets_optional or cl.has_active_filters %}
    <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-800 flex flex-col gap-2.5">
        {% if cl.model_admin.list_filter_submit %}
            <button type="submit" class="animate-btn w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 shadow-sm transition-all active:scale-95">
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
                {% trans "Apply Filters" %}
            </button>
        {% endif %}

        {% if cl.has_active_filters %}
            <a href="{{ cl.clear_all_filters_qs }}" class="animate-btn w-full text-center bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold py-2 px-4 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 transition-all">
                <span class="material-symbols-outlined text-[16px] text-red-500">delete_sweep</span>
                {% trans "Clear all filters" %}
            </a>
        {% endif %}
    </div>
{% endif %}
