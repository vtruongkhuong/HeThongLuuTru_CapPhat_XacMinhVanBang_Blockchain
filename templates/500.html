{% extends 'base.html' %}

{% block title %}500 - Lỗi máy chủ{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-[24px] shadow-soft border border-gray-100 p-8 text-center space-y-6">
        <div class="w-20 h-20 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
            <span class="material-symbols-outlined text-5xl">dns</span>
        </div>
        <div class="space-y-2">
            <h1 class="text-4xl font-extrabold text-red-600 tracking-tight">500</h1>
            <h2 class="text-lg font-bold text-gray-800 uppercase">Sự cố máy chủ nội bộ</h2>
            <p class="text-sm text-gray-500">
                Hệ thống gặp sự cố trong quá trình xử lý yêu cầu. Đội ngũ kỹ thuật đã được thông báo và đang tiến hành kiểm tra khắc phục.
            </p>
        </div>
        <div class="pt-2 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="bg-ntt-dark hover:bg-ntt-light text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase transition-all shadow-sm flex items-center justify-center gap-1.5">
                <span class="material-symbols-outlined text-base">home</span> Về trang chủ
            </a>
            <button onclick="window.location.reload()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2.5 rounded-xl font-bold text-xs uppercase transition-all flex items-center justify-center gap-1.5">
                <span class="material-symbols-outlined text-base">refresh</span> Tải lại trang
            </button>
        </div>
    </div>
</div>
{% endblock %}
