{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
        
        <!-- Tiêu đề / Logo -->
        <div class="text-center mb-6">
            <svg class="w-10 h-10 mx-auto text-indigo-600 mb-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
            </svg>
            <h2 class="text-xl font-bold text-gray-900">Đăng ký tài khoản</h2>
            <p class="text-sm text-gray-500 mt-1">Hệ thống Quản lý Văn bằng</p>
        </div>

        <!-- Form Đăng ký -->
        <form method="POST" action="">
            {% csrf_token %}
            
            <!-- Tên đăng nhập -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                <input type="text" name="username" required 
                       class="w-full bg-[#f3f4f6] border border-gray-200 text-gray-900 rounded-md focus:ring-primary-500 focus:border-primary-500 block p-2.5">
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required 
                       class="w-full bg-[#f3f4f6] border border-gray-200 text-gray-900 rounded-md focus:ring-primary-500 focus:border-primary-500 block p-2.5">
            </div>

            <!-- Mật khẩu -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" name="password" required 
                       class="w-full bg-[#f3f4f6] border border-gray-200 text-gray-900 rounded-md focus:ring-primary-500 focus:border-primary-500 block p-2.5">
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu</label>
                <input type="password" name="password_confirm" required 
                       class="w-full bg-[#f3f4f6] border border-gray-200 text-gray-900 rounded-md focus:ring-primary-500 focus:border-primary-500 block p-2.5">
            </div>

            <!-- Nút Submit -->
            <button type="submit" 
                    class="w-full text-white bg-[#5552E4] hover:bg-[#4338CA] focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors">
                Đăng ký
            </button>

            <!-- Link về trang đăng nhập -->
            <div class="text-center mt-4">
                <span class="text-sm text-gray-500">Đã có tài khoản?</span>
                <a href="{% url 'accounts:login' %}" class="text-sm text-primary-600 hover:underline font-medium ml-1">
                    Đăng nhập
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
