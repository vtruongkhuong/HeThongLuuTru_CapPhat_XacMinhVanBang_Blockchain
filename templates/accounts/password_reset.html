{% extends "base.html" %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
        <h1 class="text-lg font-semibold text-gray-900 mb-2">Quên mật khẩu</h1>
        <p class="text-sm text-gray-500 mb-6">Nhập email đã đăng ký, hệ thống sẽ gửi liên kết đặt lại mật khẩu.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit"
                class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg py-2.5 transition">
                Gửi liên kết đặt lại
            </button>
        </form>
    </div>
</div>
{% endblock %}
